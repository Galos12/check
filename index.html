<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HVAC Checklist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body { padding: 24px; background: #f8f9fa; }</style>
</head>
<body>
  <div class="container">
    <h1 class="mb-3">HVAC Checklist</h1>
    <div id="status-msg"></div>

    <form id="checklist-form">
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Técnico</label>
          <select id="technician_name" class="form-select" required>
            <option value="">Selecciona técnico</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Van</label>
          <select id="van_name" class="form-select" required>
            <option value="">Selecciona van</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Fecha (DD/MM/YYYY)</label>
          <input id="checklist_date_display" class="form-control" required>
        </div>
      </div>

      <div id="items-area" class="mb-3"></div>

      <div class="mb-3">
        <label class="form-label">Notas</label>
        <textarea id="notes" class="form-control" rows="3"></textarea>
      </div>

      <button class="btn btn-success" type="submit">Guardar lista</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/module/index.js" type="module"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/module/index.js';

    // IMPORTANT: Replace these with your Supabase project credentials
    const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
    const SUPABASE_KEY = 'YOUR_ANON_KEY';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('checklist-form');
    const statusMsg = document.getElementById('status-msg');
    const techSelect = document.getElementById('technician_name');
    const vanSelect = document.getElementById('van_name');
    const dateInput = document.getElementById('checklist_date_display');
    const itemsArea = document.getElementById('items-area');

    // Set date to today
    const today = new Date();
    dateInput.value = String(today.getDate()).padStart(2, '0') + '/' + String(today.getMonth() + 1).padStart(2, '0') + '/' + today.getFullYear();

    async function loadOptions() {
      try {
        const [techsRes, vansRes, toolsRes, partsRes] = await Promise.all([
          supabase.from('technicians').select('name').order('name'),
          supabase.from('vans').select('name').order('name'),
          supabase.from('tools_library').select('name, has_counter').order('name'),
          supabase.from('parts_library').select('name').order('name')
        ]);

        // Load technicians
        techsRes.data?.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.name;
          opt.textContent = t.name;
          techSelect.appendChild(opt);
        });

        // Load vans
        vansRes.data?.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v.name;
          opt.textContent = v.name;
          vanSelect.appendChild(opt);
        });

        // Build items checkboxes
        let html = '<h5>Herramientas</h5>';
        toolsRes.data?.forEach((t, i) => {
          html += `<div class="form-check"><input class="form-check-input" type="checkbox" id="tool-${i}" data-name="${escapeHtml(t.name)}" data-type="Tool"><label class="form-check-label" for="tool-${i}">${escapeHtml(t.name)}</label></div>`;
        });
        html += '<h5 class="mt-3">Repuestos</h5>';
        partsRes.data?.forEach((p, i) => {
          html += `<div class="form-check"><input class="form-check-input" type="checkbox" id="part-${i}" data-name="${escapeHtml(p.name)}" data-type="Part"><label class="form-check-label" for="part-${i}">${escapeHtml(p.name)}</label></div>`;
        });
        itemsArea.innerHTML = html;
      } catch (e) {
        showStatus('Error loading options: ' + e.message, 'danger');
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function showStatus(msg, type) {
      statusMsg.innerHTML = `<div class="alert alert-${type}">${escapeHtml(msg)}</div>`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const tech = techSelect.value;
      const van = vanSelect.value;
      const dateStr = dateInput.value;
      const notes = document.getElementById('notes').value || '';

      if (!tech || !van) {
        showStatus('Selecciona técnico y van', 'danger');
        return;
      }

      // Parse date DD/MM/YYYY to YYYY-MM-DD
      const [d, m, y] = dateStr.split('/');
      const isoDate = `${y.padStart(4, '0')}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;

      try {
        // Insert checklist
        const { data: checklist, error: checklistError } = await supabase
          .from('checklists')
          .insert({ technician_name: tech, van_name: van, checklist_date: isoDate, checklist_type: 'Daily', notes: notes })
          .select();

        if (checklistError) throw checklistError;

        const checklistId = checklist[0].id;

        // Collect checked items
        const items = [];
        document.querySelectorAll('#items-area .form-check-input').forEach(input => {
          if (input.checked) {
            items.push({ checklist_id: checklistId, item_name: input.dataset.name, item_type: input.dataset.type, is_checked: true });
          }
        });

        // Insert items
        if (items.length > 0) {
          const { error: itemsError } = await supabase.from('checklist_items').insert(items);
          if (itemsError) throw itemsError;
        }

        showStatus('Checklist guardado.', 'success');
        form.reset();
        dateInput.value = dateStr;
      } catch (e) {
        showStatus('Error guardando: ' + e.message, 'danger');
      }
    });

    // Load on page load
    loadOptions();
  </script>
</body>
</html>
