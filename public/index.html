<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HVAC Checklist (Static)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{padding:24px;background:#f8f9fa}</style>
</head>
<body>
  <div class="container">
    <h1 class="mb-3">HVAC Checklist — Static Preview</h1>
    <p class="text-muted">This is a static front-end published for demo. To enable saving, connect a backend (Supabase / Firestore / PHP + SQLite).</p>

    <form id="demo-form">
      <div class="mb-3">
        <label class="form-label">Técnico</label>
        <input class="form-control" id="technician_name">
      </div>
      <div class="mb-3">
        <label class="form-label">Van</label>
        <input class="form-control" id="van_name">
      </div>
      <div class="mb-3">
        <label class="form-label">Notas</label>
        <textarea class="form-control" id="notes" rows="3"></textarea>
      </div>
      <button class="btn btn-primary" type="button" onclick="alert('This is a static demo — saving disabled')">Guardar lista</button>
    </form>

    <div class="mt-4 text-muted small">To enable a live DB, I can wire this to Supabase or deploy the PHP app on Render/Fly.io.</div>
  </div>
</body>
</html>
