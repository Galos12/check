<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Historial de Checklists</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Historial de Checklists</h1>
      <div class="gap-2 d-flex">
        <a href="index.html" class="btn btn-outline-secondary">Volver al checklist</a>
        <a href="manage.html" class="btn btn-outline-secondary">Administrar opciones</a>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Técnico</th>
            <th>Van</th>
            <th>Fecha</th>
            <th>Tipo</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="history-list"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/module/index.js" type="module"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/module/index.js';

    const supabase = createClient('https://ocdggtgrpgcfjnnepxic.supabase.co', 'sb_publishable_iKGbPVOME_fCMdGmiIOTSA_zbq5yZCB');

    async function loadHistory() {
      const { data } = await supabase.from('checklists').select('*').order('created_at', { ascending: false });
      const html = (data || []).map(c => `
        <tr>
          <td>${c.technician_name}</td>
          <td>${c.van_name}</td>
          <td>${c.checklist_date}</td>
          <td>${c.checklist_type}</td>
          <td><a href="view.html?id=${c.id}" class="btn btn-sm btn-info">Ver</a></td>
        </tr>
      `).join('');
      document.getElementById('history-list').innerHTML = html;
    }

    loadHistory();
  </script>
</body>
</html>
