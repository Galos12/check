<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ver Checklist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 id="title">Checklist</h1>
      <a href="history.html" class="btn btn-outline-secondary">Volver al historial</a>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="row mb-4">
          <div class="col-md-3"><strong>Técnico:</strong> <span id="tech"></span></div>
          <div class="col-md-3"><strong>Van:</strong> <span id="van"></span></div>
          <div class="col-md-3"><strong>Fecha:</strong> <span id="date"></span></div>
          <div class="col-md-3"><strong>Tipo:</strong> <span id="type"></span></div>
        </div>

        <h5 class="mt-4">Herramientas</h5>
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Llevado</th>
                <th>Herramienta</th>
              </tr>
            </thead>
            <tbody id="tools-list"></tbody>
          </table>
        </div>

        <h5 class="mt-4">Repuestos</h5>
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Llevado</th>
                <th>Repuesto</th>
              </tr>
            </thead>
            <tbody id="parts-list"></tbody>
          </table>
        </div>

        <div class="mt-4">
          <strong>Notas:</strong>
          <p id="notes"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/module/index.js" type="module"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/module/index.js';

    const supabase = createClient('https://ocdggtgrpgcfjnnepxic.supabase.co', 'sb_publishable_iKGbPVOME_fCMdGmiIOTSA_zbq5yZCB');

    const params = new URLSearchParams(window.location.search);
    const checklistId = params.get('id');

    async function loadChecklist() {
      if (!checklistId) return;

      const { data: checklist } = await supabase.from('checklists').select('*').eq('id', checklistId).single();
      const { data: items } = await supabase.from('checklist_items').select('*').eq('checklist_id', checklistId);

      if (!checklist) return;

      document.getElementById('tech').textContent = checklist.technician_name;
      document.getElementById('van').textContent = checklist.van_name;
      document.getElementById('date').textContent = checklist.checklist_date;
      document.getElementById('type').textContent = checklist.checklist_type;
      document.getElementById('notes').textContent = checklist.notes || '(sin notas)';

      const tools = (items || []).filter(i => i.item_type === 'Tool');
      const parts = (items || []).filter(i => i.item_type === 'Part');

      document.getElementById('tools-list').innerHTML = tools.map(t => `
        <tr>
          <td><input type="checkbox" ${t.is_checked ? 'checked' : ''} disabled></td>
          <td>${t.item_name}</td>
        </tr>
      `).join('');

      document.getElementById('parts-list').innerHTML = parts.map(p => `
        <tr>
          <td><input type="checkbox" ${p.is_checked ? 'checked' : ''} disabled></td>
          <td>${p.item_name}</td>
        </tr>
      `).join('');
    }

    loadChecklist();
  </script>
</body>
</html>
